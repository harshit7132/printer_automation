<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b3df5">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Owner dashboard</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <!-- Login -->
  <div class="login-wrap hidden" id="loginView">
    <form class="card login-card" id="loginForm">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <h2>Owner login</h2>
      <p class="muted">Only the shop owner can access orders and files.</p>
      <div class="field"><label for="u">Username</label><input id="u" type="text" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="admin-shell hidden" id="appView">
    <aside class="side">
      <a class="brand" href="/" target="_blank" rel="noopener">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg></span>
        <span class="brand-name">Owner</span>
      </a>
      <nav id="sideTabs"></nav>
      <div class="spacer"></div>
      <button class="tab-btn" type="button" id="soundToggle"><span class="ico" id="soundIco">🔊</span> <span id="soundText">Voice alerts ON</span></button>
      <button class="tab-btn" type="button" data-logout><span class="ico">⎋</span> Log out</button>
    </aside>
    <div>
      <header class="topbar only-mobile">
        <span class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg></span><span class="brand-name">Owner</span></span>
        <button class="lang-toggle" type="button" id="mobileSoundToggle" title="Toggle sound">🔊</button>
        <button class="lang-toggle" type="button" data-logout>Log out</button>
      </header>
      <nav class="mobile-tabs" id="mobileTabs"></nav>
      <main class="content">
        <div class="stats" id="stats"></div>
        <div id="tab"></div>
      </main>
    </div>
  </div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
