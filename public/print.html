<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b3df5">
  <title>Print — e-Mitra</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg></span>
      <span class="brand-name" data-shop-name>e-Mitra</span>
    </a>
    <div class="top-actions">
      <button class="acct-btn hidden" id="accountBtn" type="button"></button>
      <button class="lang-toggle" id="langToggle" type="button" data-i18n="lang_switch">हिंदी</button>
    </div>
  </header>

  <main class="container">
    <div class="stepbar" id="stepbar">
      <div class="s" data-i18n="step_details">Details</div>
      <div class="s" data-i18n="step_upload">Upload</div>
      <div class="s" data-i18n="step_pay">Pay</div>
      <div class="s" data-i18n="step_collect">Collect</div>
    </div>

    <!-- Step 1: details -->
    <section data-step="1">
      <form class="card" id="detailsForm" novalidate>
        <h2 data-i18n="details_title">Your details</h2>
        <p class="muted" data-i18n="details_sub">So we know whose prints are whose.</p>
        <div id="savePrompt"></div>
        <div class="field">
          <label for="name" data-i18n="f_name">Full name</label>
          <input id="name" type="text" autocomplete="name" maxlength="60" data-i18n-ph="f_name_ph" required>
          <span class="err" data-i18n="err_name"></span>
        </div>
        <div class="field">
          <label for="phone" data-i18n="f_phone">Mobile number</label>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" data-i18n-ph="f_phone_ph" required>
          <span class="err" data-i18n="err_phone"></span>
        </div>
        <div class="field">
          <label for="notes" data-i18n="f_notes">Note for the shop (optional)</label>
          <input id="notes" type="text" maxlength="300" data-i18n-ph="f_notes_ph">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" data-i18n="next">Continue</button>
      </form>
    </section>

    <!-- Step 2a: choose & upload -->
    <section data-step="2" class="hidden">
      <div class="card">
        <h2 data-i18n="upload_title">Upload your files</h2>
        <p class="muted" data-i18n="upload_sub"></p>
        <label class="dropzone" id="dropzone">
          <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
          <span class="dz-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
          <b data-i18n="drop_title">Tap to choose files</b>
          <small id="dropSub"></small>
        </label>
        <div class="file-list" id="localList"></div>
        <div id="uploadProgress" class="hidden">
          <div class="progress"><div id="progressBar"></div></div>
          <p class="muted small" id="progressText" style="margin-top:8px"></p>
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-ghost" type="button" data-back="1" data-i18n="back">Back</button>
        <button class="btn btn-primary btn-lg" type="button" id="uploadBtn" data-i18n="upload_btn">Upload</button>
      </div>
    </section>

    <!-- Step 2b: options -->
    <section data-step="3" class="hidden">
      <div class="card">
        <h2 data-i18n="options_title">Print options</h2>
        <p class="muted" data-i18n="options_sub"></p>
        <div class="file-list" id="optList"></div>
      </div>
      <p style="text-align:center;margin-top:16px"><button class="btn btn-ghost btn-sm" type="button" id="restartBtn" data-i18n="add_more"></button></p>
    </section>
  </main>

  <div class="bottom-bar hidden" id="bottomBar">
    <div class="inner">
      <div class="total"><small data-i18n="total">Total</small><b id="totalAmt">₹0</b></div>
      <button class="btn btn-primary btn-lg" type="button" id="payBtn" data-i18n="pay_btn">Continue to pay</button>
    </div>
  </div>

  <script type="module" src="/js/print.js"></script>
</body>
</html>
